services:
  db:
    image: pgvector/pgvector:pg16
    container_name: acid-agent-db
    environment:
      POSTGRES_USER: acid
      POSTGRES_PASSWORD: acid
      POSTGRES_DB: acid_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acid -d acid_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
