[project]
name = "acid-agent"
version = "0.1.0"
description = "ACID-compliant data agent — implementation of 'Agentic Transactions: Towards ACID-Compliant Agent Systems'"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<0.7",
    "langgraph-checkpoint-postgres>=2",
    "langchain-core>=0.3",
    "langsmith>=0.1",
    "psycopg[binary,pool]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local confidence model (Qwen3-0.6B). Install with: pip install -e ".[confidence]"
confidence = [
    "torch>=2.4",
    "transformers>=4.46",
    "accelerate>=0.34",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acid_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Note: skills are validated with pytest per skill dir (skills.py validate_skill).